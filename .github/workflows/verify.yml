# Typecheck gate.
#
# Why this exists: on 2026-08-07 two direct-to-main pushes from
# gpt-engineer-app[bot] (Lovable) deleted 671 lines from
# src/integrations/supabase/types.ts, stripping generation_requests, waitlist,
# synthesis_insights, voice_corpus and every billing column on profiles. That
# broke `tsc --noEmit` on main.
#
# Nothing noticed, because `vite build` does NOT run tsc: Vercel kept
# deploying green while the typecheck was broken. The repo had no CI at all.
#
# So this runs on pull requests AND on direct pushes to main, because the
# thing it is guarding against arrives as a direct push.

name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level moderate

      # The real gate. This is what caught the stripped types, and what would
      # have caught them on the push that caused it.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and gate tests
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build

      # A named canary on top of tsc, so the failure reads as "the generated
      # Supabase types were gutted" rather than a wall of inference errors.
      # Regenerate with the Management API, do not hand-patch:
      #   GET /v1/projects/{ref}/types/typescript?included_schemas=public
      - name: Supabase types are not stale
        run: |
          for t in generation_requests waitlist synthesis_insights voice_corpus; do
            if ! grep -q "$t" src/integrations/supabase/types.ts; then
              echo "::error file=src/integrations/supabase/types.ts::'$t' missing from the generated Supabase types. They have been stripped or are stale. Regenerate from the live schema."
              exit 1
            fi
          done
          echo "Supabase types look complete."

      - name: Pundit-system migration is present
        run: |
          migration="supabase/migrations/20260808194138_pundit_intelligence_system.sql"
          for t in daily_drops evidence_packs analysis_claims pundit_specs pundit_variants harness_runs prediction_ledger research_sources concept_cards pronunciation_lexicon; do
            if ! grep -q "public.$t" "$migration"; then
              echo "::error file=$migration::'$t' is missing from the pundit-system migration."
              exit 1
            fi
          done

      - name: Operational release-gate migration is present and ordered
        run: |
          migration="supabase/migrations/20260808200000_operational_release_gates.sql"
          for t in voice_candidates audio_reviews forecast_models evaluation_matches evaluation_runs evaluation_reviews editorial_runs rehearsal_runs release_signoffs release_state release_gate_runs; do
            if ! grep -q "public.$t" "$migration"; then
              echo "::error file=$migration::'$t' is missing from the operational migration."
              exit 1
            fi
          done
          grep -q "missing_required_harnesses" "$migration"
          grep -q "public_launch_enabled BOOLEAN NOT NULL DEFAULT false" "$migration"
          grep -q "billing_enabled BOOLEAN NOT NULL DEFAULT false" "$migration"
