name: Full Time - Manual Daily Drop Recovery

on:
  workflow_dispatch:
    inputs:
      recordingAction:
        description: "inspect or publish the already approved Reporter recording"
        required: false
      recordingManifest:
        description: "Base64 frozen approved recording manifest"
        required: false
      reviewSubject:
        description: "One approved Reporter listening review, base64 sealed evidence and candidate. No publication or narration."
        required: false
      reviewScriptSha:
        description: "SHA-256 of the exact approved listening-review display script"
        required: false
      date:
        description: "YYYY-MM-DD coverage date (default: yesterday, London time)"
        required: false
      matchId:
        description: "Produce this exact match instead of the day's most important one"
        required: false
      attempts:
        description: "Repair rounds per pundit (default 2). 1 halves the cost of a diagnostic run; it can only lower the environment's ceiling, never raise it"
        required: false
      recoveryCandidate:
        description: "Reviewed recovery manifest under scripts/editorial-recovery/. One judging pass; no writer or claim generation."
        required: false
      productionVariant:
        description: "Resume audio for a stored variant whose editorial checks already passed. No model review."
        required: false

jobs:
  drop:
    if: ${{ !inputs.recoveryCandidate && !inputs.productionVariant && !inputs.reviewSubject && !inputs.recordingAction }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily drop
        run: |
          set -euo pipefail
          QS=""
          if [ -n "${DATE_IN:-}" ]; then QS="?date=${DATE_IN}"; fi
          if [ -n "${MATCH_IN:-}" ]; then
            if [ -z "$QS" ]; then QS="?matchId=${MATCH_IN}"; else QS="${QS}&matchId=${MATCH_IN}"; fi
          fi
          if [ -n "${ATTEMPTS_IN:-}" ]; then
            if [ -z "$QS" ]; then QS="?attempts=${ATTEMPTS_IN}"; else QS="${QS}&attempts=${ATTEMPTS_IN}"; fi
          fi
          curl --fail --silent --show-error \
            -X POST "${FULL_TIME_URL}/api/internal/daily-rehearsal${QS}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d '{}'
        env:
          FULL_TIME_URL: ${{ secrets.FULL_TIME_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE_IN: ${{ inputs.date }}
          MATCH_IN: ${{ inputs.matchId }}
          ATTEMPTS_IN: ${{ inputs.attempts }}
  recover:
    if: ${{ (inputs.recoveryCandidate || inputs.productionVariant) && !inputs.reviewSubject && !inputs.recordingAction }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: single-editorial-recovery
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recover the reviewed single edition
        run: |
          if [ -n "${PRODUCTION_VARIANT:-}" ]; then
            npx --yes tsx@4.20.6 scripts/resume-approved-production.ts
          else
            npx --yes tsx@4.20.6 scripts/recover-editorial.ts
          fi
        env:
          PRODUCTION_VARIANT: ${{ inputs.productionVariant }}
          RECOVERY_CANDIDATE: ${{ inputs.recoveryCandidate }}
          SUPABASE_URL: https://hzadscrqmyilbisexvyz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FULL_TIME_URL: ${{ secrets.FULL_TIME_URL }}
          PUNDIT_JUDGE_MODEL: gpt-5.6-terra
          PUNDIT_MAX_STEP_COST_USD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-editorial-recovery
          path: recovery-report.json
          if-no-files-found: ignore
  listening-review:
    if: ${{ inputs.reviewSubject && !inputs.recoveryCandidate && !inputs.productionVariant && !inputs.recordingAction }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: reporter-listening-review-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review only, no retries, no production credentials
        run: npx --yes tsx@4.20.6 scripts/review-listening-candidate.ts
        env:
          REVIEW_SUBJECT: ${{ inputs.reviewSubject }}
          REVIEW_SCRIPT_SHA: ${{ inputs.reviewScriptSha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUNDIT_JUDGE_MODEL: gpt-5.6-terra
          PUNDIT_MAX_STEP_COST_USD: "0.5"
          PUNDIT_MODEL_CONCURRENCY: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporter-listening-review
          path: listening-review-report.json
          if-no-files-found: error

  recording:
    if: ${{ inputs.recordingAction }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: reporter-existing-recording-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import only the recording Krish approved
        run: npx --yes tsx@4.20.6 scripts/publish-approved-recording.ts
        env:
          APPROVED_RECORDING_MANIFEST: ${{ inputs.recordingManifest }}
          SUPABASE_URL: https://hzadscrqmyilbisexvyz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-recording-publication
          path: approved-recording-*.json
          retention-days: 30
