name: Full Time - Manual Daily Drop Recovery

on:
  workflow_dispatch:

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily drop
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$FULL_TIME_URL/api/internal/daily-rehearsal" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -d '{}'
        env:
          FULL_TIME_URL: ${{ secrets.FULL_TIME_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
