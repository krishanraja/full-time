name: Full Time - Manual Daily Ingest Recovery

# Vercel owns the production schedule. This job is intentionally manual and
# exists only for an operator-approved recovery run.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to ingest (default: yesterday, UK time)"
        required: false
      season:
        description: "Season year (default: FT_SEASON, else 2026)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily ingest
        run: |
          set -euo pipefail
          QS=""
          if [ -n "${DATE_IN:-}" ]; then QS="?date=${DATE_IN}"; fi
          if [ -n "${SEASON_IN:-}" ]; then
            if [ -z "$QS" ]; then QS="?season=${SEASON_IN}"; else QS="${QS}&season=${SEASON_IN}"; fi
          fi
          curl --fail --silent --show-error --max-time 800 \
            -X POST "${FULL_TIME_URL}/api/public/cron/ingest${QS}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d '{}' | tee response.json
        env:
          FULL_TIME_URL: ${{ secrets.FULL_TIME_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATE_IN: ${{ inputs.date }}
          SEASON_IN: ${{ inputs.season }}
