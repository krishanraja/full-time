minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  ffmpeg-static: true
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
overrides:
  "@babel/core@": 7.29.7
  "@vercel/routing-utils@6.4.1>path-to-regexp": 6.3.0
  "@workflow/core@4.8.1>nanoid": 5.1.16
  "@workflow/world-local@4.2.4>undici": 7.29.1
  "@workflow/world-vercel@4.6.2>undici": 7.29.1
  # Advisories published after 2026-09-27 turned the prod audit red on main.
  # Each is the patch release on the line already in use, pinned exactly.
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.7
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.12
  "piscina@>=4.0.0 <5.0.0": 4.9.4
  qs: ">=6.16.0"
  # Pinned exactly, not ">=". A range floats to the next major: devalue went to
  # 6.0.0 and js-yaml to 5.4.2, which is far more change than the advisories
  # ask for. devalue is what @workflow/core serialises durable workflow state
  # with, so a format change there would break runs that are already in flight
  # and would do it quietly.
  devalue: 5.9.3
  js-yaml: 4.3.2
